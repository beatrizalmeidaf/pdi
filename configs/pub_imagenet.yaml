# Rodada para publicação — ImageNet-1k val COMPLETO (50 000 imagens, 1000 classes, 224 px), 7 modelos.
# Sem sementes: usa todas as imagens. Sem E4 (não há treino do ImageNet local).
# Paralelizado em fatias (--set shard=k/n) e juntado com `pdi merge-shards`.
extends: sweep.yaml
run_name: pub_imagenet
seed: 0
device: cuda
n_workers: 4
batch_size: 32

paths:
  imagenet_val: data/imagenet/val

datasets:
  _replace: true
  imagenet_val:
    n_images: null
    models: [resnet18, resnet50, vgg16_bn, efficientnet_b0, convnext_tiny, vit_b_16, swin_t]

quality:
  brisque: true
  lpips: true
  feature_distance: true

thresholds:
  bootstrap: 300           # 50 mil imagens: IC já é estreito; 1000 reamostragens levariam horas

ire:
  # fator conformal da dose segura (α = 0,1): aceitar só doses com flip previsto <= c·τ. Calibrado com as 20 técnicas
  # (14 originais + 6 de validação externa; scripts/ire_validacao_externa.py): deixando cada técnica de fora, 90 % delas
  # ficam seguras em todos os modelos (ImageNet-val). Com só as 14 originais o fator era 0,55.
  safe_margin: 0.65
