# Rodada para publicação — CIFAR-10 (32 px): 5 CNNs, 3 sementes, LPIPS e distância entre features.
# A semente muda o subconjunto de 2000 imagens de teste (e de treino do E4) e o fine-tuning.
# Uma pasta por semente (run_name é trocado pelo script):
#   bash scripts/run_publicacao.sh
extends: sweep.yaml
run_name: pub_cifar10_s0
seed: 0
device: cuda
n_workers: 16
batch_size: 128

datasets:
  _replace: true
  cifar10:
    n_images: 2000
    n_train: 5000
    models: [cifar10_resnet20, cifar10_resnet56, cifar10_vgg16_bn, cifar10_mobilenetv2_x1_0, cifar10_repvgg_a0]

quality:
  brisque: true
  lpips: true
  feature_distance: true

adaptation:
  finetune_epochs: 3

ire:
  # fator conformal da dose segura (α = 0,1): aceitar só doses com flip previsto <= c·τ. Calibrado com as 20 técnicas
  # (14 originais + 6 de validação externa; scripts/ire_validacao_externa.py): deixando cada técnica de fora, 90 % delas
  # ficam seguras em todos os modelos (CIFAR-10). Com só as 14 originais o fator era 0,18.
  safe_margin: 0.23
